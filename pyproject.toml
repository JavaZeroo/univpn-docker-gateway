[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "univpn-docker-gateway"
version = "0.4.0"
description = "Experimental subnet gateway and terminal authentication for the official UniVPN client"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = []

[project.scripts]
vpnctl = "univpn_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["univpn_gateway*"]
