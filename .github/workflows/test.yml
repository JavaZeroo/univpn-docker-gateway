name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q univpn_gateway
      - run: bash -n scripts/vpnctl
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo python3 tests/network_integration.py
  wireguard:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends wireguard-tools
      - run: sudo python3 tests/wireguard_integration.py
  windows-plan:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows_gateway_test.ps1
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows_profile_test.ps1
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows_client_test.ps1
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows_prerequisites_test.ps1
  public-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.public -t univpn-public:test .
      - run: docker run --rm univpn-public:test --help
      - name: Image contains no vendor runtime or private profile
        run: docker run --rm --entrypoint sh univpn-public:test -c 'test ! -e /usr/local/UniVPN/serviceclient/UniVPNCS && test ! -e /opt/gateway/client/private'
      - name: Export client without VPN or administrator capabilities
        run: |
          mkdir -p "$RUNNER_TEMP/univpn-client"
          docker run --rm -v "$RUNNER_TEMP/univpn-client:/output" univpn-public:test export-client
          test -f "$RUNNER_TEMP/univpn-client/univpn/univpn.ps1"
  windows-prerequisites:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare signed WireGuard on disposable Windows runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/windows-prerequisites.ps1
          try {
            $result = Ensure-UVPNWireGuard
            if (-not $result.Ready) { throw 'WireGuard prerequisite did not become ready.' }
            $result | Select-Object Status,Ready,Reused,RestartRequired | ConvertTo-Json
          } catch {
            if ($_.Exception.Data['UVPNRestartRequired']) {
              Write-Host 'MSI returned RestartRequired; preparation correctly stopped before VPN connection.'
            } else { throw }
          }
  accessibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-pyatspi python3-pyqt5 at-spi2-core dbus-x11 xvfb xauth
      - run: dbus-run-session -- xvfb-run -a env QT_ACCESSIBILITY=1 QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1 /usr/bin/python3 tests/accessibility_integration.py
