<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">UniVPN Docker Gateway</title>
  <desc id="description">A terminal frontend for the official UniVPN engine. Windows applications reach selected IP destinations through WireGuard and a VPN container with its own network namespace.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1527"/>
      <stop offset="1" stop-color="#182647"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59dfc3"/>
      <stop offset="1" stop-color="#7ba8ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7ba8ff" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#80a6e9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#background)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <path d="M620 30 C770 40 762 360 1230 350" fill="none" stroke="#34558c" opacity="0.3"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="52" y="44" width="210" height="27" rx="13.5" fill="#1b3441" stroke="#345f69"/>
    <circle cx="69" cy="57.5" r="3.5" fill="#59dfc3"/>
    <text x="81" y="62" font-size="11" font-weight="600" letter-spacing="1.3" fill="#a4f3e0">NATIVE · ISOLATED · DIRECT</text>
    <text x="50" y="143" font-size="62" font-weight="700" letter-spacing="-2" fill="#f1f6ff">UniVPN</text>
    <text x="50" y="209" font-size="57" font-weight="700" letter-spacing="-2" fill="url(#accent)">Docker Gateway</text>
    <text x="54" y="257" font-size="19" fill="#b8c8e3">Terminal MFA. Your apps. Their original IPs.</text>
    <text x="54" y="288" font-size="15" fill="#8da4c7">One VPN per container. Explicit destinations. No desktop stack.</text>
    <g font-size="12" font-weight="600" fill="#cbd9ef">
      <rect x="54" y="326" width="115" height="30" rx="7" fill="#1c2e4c" stroke="#334a6b"/>
      <text x="71" y="346">Python stdlib</text>
      <rect x="179" y="326" width="119" height="30" rx="7" fill="#1c2e4c" stroke="#334a6b"/>
      <text x="195" y="346">Official CSDK</text>
      <rect x="308" y="326" width="105" height="30" rx="7" fill="#1c2e4c" stroke="#334a6b"/>
      <text x="324" y="346">WireGuard</text>
    </g>
    <rect x="723" y="48" width="412" height="67" rx="12" fill="#1a2b47" stroke="#49638a"/>
    <g fill="#80a6e9">
      <rect x="743" y="69" width="10" height="10" rx="1"/>
      <rect x="756" y="69" width="10" height="10" rx="1"/>
      <rect x="743" y="82" width="10" height="10" rx="1"/>
      <rect x="756" y="82" width="10" height="10" rx="1"/>
    </g>
    <text x="784" y="77" font-size="16" font-weight="600" fill="#edf4ff">Windows applications</text>
    <text x="784" y="99" font-size="12" fill="#9fb6d9">SSH · HTTP · UDP  /  selected IPv4 destinations</text>
    <path d="M929 116 L929 161" stroke="#80a6e9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="945" y="143" font-size="11" fill="#9fb6d9">WireGuard → localhost UDP</text>
    <rect x="690" y="183" width="489" height="156" rx="14" fill="#15233c" stroke="#344e76" opacity="0.6"/>
    <rect x="677" y="171" width="489" height="156" rx="14" fill="#14263f" stroke="#59aeb0"/>
    <rect x="678" y="172" width="487" height="37" rx="13" fill="#1c344e"/>
    <path d="M678 209 H1165" stroke="#33516e"/>
    <circle cx="697" cy="190" r="4" fill="#59dfc3"/>
    <text x="711" y="195" font-size="11" letter-spacing="1.2" font-weight="600" fill="#b3e9e6">ONE CONTAINER · ONE NETWORK NAMESPACE</text>
    <rect x="699" y="231" width="115" height="66" rx="9" fill="#1d3e50" stroke="#3e7f89"/>
    <text x="756.5" y="257" text-anchor="middle" font-size="16" font-weight="600" fill="#b1f5e4">wg0</text>
    <text x="756.5" y="278" text-anchor="middle" font-size="11" fill="#8dc9c7">WireGuard</text>
    <path d="M821 264 H846" stroke="#80a6e9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="856" y="231" width="126" height="66" rx="9" fill="#263859" stroke="#536c9c"/>
    <text x="919" y="257" text-anchor="middle" font-size="14" font-weight="600" fill="#d4e1ff">Forward + SNAT</text>
    <text x="919" y="278" text-anchor="middle" font-size="11" fill="#a5bde7">CIDR allowlist</text>
    <path d="M990 264 H1015" stroke="#80a6e9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="1025" y="231" width="120" height="66" rx="9" fill="#202f49" stroke="#465d83"/>
    <text x="1085" y="257" text-anchor="middle" font-size="14" font-weight="600" fill="#e3ecfa">cnem_vnic</text>
    <text x="1085" y="278" text-anchor="middle" font-size="11" fill="#9fb6d9">VPN interface</text>
    <text x="925" y="368" text-anchor="middle" font-size="12" fill="#8da4c7">Independent frontend · Vendor client required · IPv4</text>
  </g>
</svg>
