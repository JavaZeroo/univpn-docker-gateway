<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">UniVPN Docker Gateway — Lite and Full</title>
  <desc id="description">Two entries for isolated UniVPN containers with terminal MFA. Lite is an application-configured SOCKS5 proxy for numeric IPv4 TCP, without WireGuard. Full uses a Windows WireGuard interface for original-IP IPv4 TCP and UDP routing.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1527"/>
      <stop offset="1" stop-color="#182647"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59dfc3"/>
      <stop offset="1" stop-color="#7ba8ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#7ba8ff" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#80a6e9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#background)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <path d="M625 32 C780 40 750 372 1230 368" fill="none" stroke="#34558c" opacity="0.3"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="52" y="44" width="242" height="27" rx="13.5" fill="#1b3441" stroke="#345f69"/>
    <circle cx="69" cy="57.5" r="3.5" fill="#59dfc3"/>
    <text x="81" y="62" font-size="11" font-weight="600" letter-spacing="1.1" fill="#a4f3e0">NATIVE MFA · ISOLATED VPNS</text>
    <text x="50" y="143" font-size="62" font-weight="700" letter-spacing="-2" fill="#f1f6ff">UniVPN</text>
    <text x="50" y="209" font-size="55" font-weight="700" letter-spacing="-2" fill="url(#accent)">Docker Gateway</text>
    <text x="54" y="256" font-size="19" fill="#b8c8e3">Two entries. Shared native authentication.</text>
    <text x="54" y="288" font-size="15" fill="#8da4c7">Lite app proxy. Full IP routing. One VPN per container.</text>
    <g font-size="12" font-weight="600" fill="#cbd9ef">
      <rect x="54" y="330" width="115" height="30" rx="7" fill="#1c2e4c" stroke="#334a6b"/>
      <text x="71" y="350">Python stdlib</text>
      <rect x="179" y="330" width="119" height="30" rx="7" fill="#1c2e4c" stroke="#334a6b"/>
      <text x="195" y="350">Official CSDK</text>
      <rect x="308" y="330" width="111" height="30" rx="7" fill="#1c2e4c" stroke="#334a6b"/>
      <text x="325" y="350">No desktop</text>
    </g>

    <rect x="665" y="45" width="560" height="144" rx="14" fill="#142d3d" stroke="#3e7f89"/>
    <rect x="685" y="61" width="53" height="23" rx="6" fill="#224d52"/>
    <text x="711.5" y="77" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#a8f1dd">LITE</text>
    <text x="753" y="78" font-size="16" font-weight="600" fill="#edf4ff">Configure the app's proxy</text>
    <g font-size="12" text-anchor="middle">
      <rect x="685" y="103" width="140" height="40" rx="8" fill="#1d3e50" stroke="#3e7f89"/>
      <text x="755" y="128" fill="#b1f5e4">App + SOCKS5</text>
      <path d="M833 123 H861" stroke="#80a6e9" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="871" y="103" width="141" height="40" rx="8" fill="#233b51" stroke="#476684"/>
      <text x="941.5" y="128" fill="#d4e1ff">Container TCP relay</text>
      <path d="M1020 123 H1048" stroke="#80a6e9" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="1058" y="103" width="147" height="40" rx="8" fill="#20314a" stroke="#465d83"/>
      <text x="1131.5" y="128" fill="#e3ecfa">UniVPN</text>
    </g>
    <text x="685" y="169" font-size="12" fill="#98cec9">Numeric IPv4 · TCP only · No WireGuard</text>

    <rect x="665" y="208" width="560" height="144" rx="14" fill="#172840" stroke="#49638a"/>
    <rect x="685" y="224" width="53" height="23" rx="6" fill="#2b4166"/>
    <text x="711.5" y="240" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#bed3ff">FULL</text>
    <text x="753" y="241" font-size="16" font-weight="600" fill="#edf4ff">Use original target IPs</text>
    <g font-size="12" text-anchor="middle">
      <rect x="685" y="266" width="140" height="40" rx="8" fill="#233858" stroke="#536c9c"/>
      <text x="755" y="291" fill="#d4e1ff">Windows app</text>
      <path d="M833 286 H861" stroke="#80a6e9" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="871" y="266" width="141" height="40" rx="8" fill="#233858" stroke="#536c9c"/>
      <text x="941.5" y="291" fill="#d4e1ff">Windows WireGuard</text>
      <path d="M1020 286 H1048" stroke="#80a6e9" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="1058" y="266" width="147" height="40" rx="8" fill="#20314a" stroke="#465d83"/>
      <text x="1131.5" y="291" fill="#e3ecfa">wg0 → UniVPN</text>
    </g>
    <text x="685" y="332" font-size="12" fill="#9fb6d9">IPv4 TCP / UDP · Explicit CIDRs · Dedicated host routes</text>
    <text x="945" y="387" text-anchor="middle" font-size="12" fill="#8da4c7">Terminal authentication · Pinned official download · No GUI stack</text>
  </g>
</svg>
