services:
  vpn:
    image: ${UVPN_IMAGE:-javazero/univpn-docker-gateway:latest}
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "127.0.0.1:${WG_PORT:-51829}:51820/udp"
    volumes:
      - ${VPN_CONFIG_DIR:-./private}/vpn.json:/config/vpn.json:ro
      - ${VPN_CONFIG_DIR:-./private}/wg0.conf:/config/wg0.conf:ro
      - vendor-cache:/var/cache/univpn
    tmpfs:
      - /run
      - /tmp
      - /root/UniVPN:mode=0700
      - /usr/local/UniVPN/log:mode=0700
      - /usr/local/UniVPN/serviceclient/log:mode=0700
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    restart: "no"
    logging:
      # The vendor CLI echoes usernames. Keep interactive authentication out of logs.
      driver: none
volumes:
  vendor-cache:
